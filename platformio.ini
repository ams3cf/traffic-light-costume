; =============================================================================
; Traffic Light Costume — PlatformIO configuration
; Target: generic ESP32 DevKit (esp32dev). Board variant is a placeholder;
; change `board` to match your exact module (see README "Board variant").
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; WS2812B LED driver. FastLED is the de-facto standard for these strips.
lib_deps =
    fastled/FastLED @ ^3.7.0

; Optional: uncomment for verbose compiler output during troubleshooting.
; build_flags =
;     -D CORE_DEBUG_LEVEL=3
