; =============================================================================
; Traffic Light Costume — PlatformIO configuration
; Target: generic ESP32 DevKit (esp32dev). Board variant is a placeholder;
; change `board` to match your exact module (see README "Board variant").
; =============================================================================

[platformio]
default_envs = bench, production

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; FastLED 3.10.x drives WS2812B solid white on this Arduino-ESP32 2.0.x core; stay on 3.7.8.
lib_deps =
    fastled/FastLED @ 3.7.8
    h2zero/NimBLE-Arduino @ ^2.3.6

[env:esp32dev]
extends = env:bench

[env:bench]
build_flags = -D BUILD_PROFILE_BENCH=1

[env:production]
build_flags = -D SERIAL_DEBUG=0 -D BUILD_PROFILE_PRODUCTION=1

; Optional: uncomment for verbose compiler output during troubleshooting.
; build_flags =
;     -D CORE_DEBUG_LEVEL=3
