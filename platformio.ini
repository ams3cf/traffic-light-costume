; =============================================================================
; Traffic Light Costume — PlatformIO configuration
; Target: ESP-WROOM-32 DevKit (esp32dev).
; =============================================================================

[platformio]
default_envs = bench, production

[esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; FastLED 3.10.x drives WS2812B solid white on this Arduino-ESP32 2.0.x core; stay on 3.7.8.
lib_deps =
    fastled/FastLED @ 3.7.8
    olikraus/U8g2 @ 2.36.18

; 3-pixel bench chain, one pixel per chamber.
[env:bench]
extends = esp32
build_flags = -D BUILD_PROFILE_BENCH=1

; 87-pixel costume chain, serial debug off.
[env:production]
extends = esp32
build_flags = -D SERIAL_DEBUG=0 -D BUILD_PROFILE_PRODUCTION=1

; Over-the-air uploads to a costume in home Wi-Fi mode (hold MODE + GREEN for 3 s):
;   pio run -e production_ota -t upload
; Use --upload-port <ip> if trafficlight.local does not resolve (the OLED shows the IP).
; The costume connects back to this computer on host_port, so a firewall must allow
; it (see README, "Uploading over the air").
[env:bench_ota]
extends = env:bench
upload_protocol = espota
upload_port = trafficlight.local
upload_flags = --host_port=40100

[env:production_ota]
extends = env:production
upload_protocol = espota
upload_port = trafficlight.local
upload_flags = --host_port=40100

; Host unit tests for the pure logic: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<state.cpp> +<gestures.cpp>
